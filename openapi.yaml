openapi: 3.1.0
info:
  title: GXEON JSON Validate API
  version: 1.0.1
  summary: Pay-per-request JSON validation for software and AI agents.
  description: |
    Current x402 public launch scope: JSON Validate only.
    CSV Audit remains in technical recovery and is not advertised as a paid x402 route
    until an independent paid-delivery retest returns HTTP 200 with a GXEON receipt.
    Unpaid requests receive HTTP 402 with x402 v2 payment requirements in PAYMENT-REQUIRED.
    After payment, retry the exact same request with PAYMENT-SIGNATURE.
servers:
  - url: https://gxeon-wallet-command-center.vercel.app
tags:
  - name: Validation
    description: Paid machine-to-machine JSON validation.
paths:
  /x402/json-validate:
    post:
      operationId: gxeonJsonValidate
      tags: [Validation]
      summary: Validate JSON syntax and an optional lightweight schema.
      description: |
        Price: 0.01 USDC per request on Base mainnet (eip155:8453).
        Send the same body again with PAYMENT-SIGNATURE after receiving the 402 challenge.
        A successful delivery returns the validation result and a GXEON receipt.
      x-x402:
        version: 2
        scheme: exact
        network: eip155:8453
        asset: USDC
        amount: "10000"
        currency: USDC
        decimals: 6
      parameters:
        - $ref: '#/components/parameters/PaymentSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonValidateInput'
            example:
              payload:
                ready: true
              schema:
                type: object
                required: [ready]
                properties:
                  ready:
                    type: boolean
      responses:
        '200':
          description: Validation result delivered and receipt recorded.
          headers:
            PAYMENT-RESPONSE:
              schema: { type: string }
              description: Base64-encoded x402 v2 settlement response.
            X-402-Receipt:
              schema: { type: string }
            X-402-Settlement:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JsonValidateSuccess' }
        '402':
          description: Payment required. Decode PAYMENT-REQUIRED and satisfy its accepts terms.
          headers:
            PAYMENT-REQUIRED:
              schema: { type: string }
              description: Base64-encoded x402 v2 challenge.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentChallenge' }
        '400':
          description: Invalid request body or validation input.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Payment settlement or result delivery is pending/unavailable. Retry only with the original request and original payment authorization; do not pay again.
          headers:
            Retry-After:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RetryableError' }
components:
  parameters:
    PaymentSignature:
      name: PAYMENT-SIGNATURE
      in: header
      required: false
      description: x402 v2 payment payload. Omit on the first request to receive the 402 challenge.
      schema: { type: string }
  schemas:
    JsonValidateInput:
      type: object
      additionalProperties: false
      anyOf:
        - required: [payload]
        - required: [rawJson]
      properties:
        payload:
          description: Any parsed JSON value or a string containing JSON text.
        rawJson:
          type: string
          description: Alternative raw JSON text field.
        schema:
          type: object
          properties:
            type: { type: string }
            required:
              type: array
              items: { type: string }
            properties:
              type: object
              additionalProperties:
                type: object
                properties:
                  type: { type: string }
    JsonValidateSuccess:
      type: object
      required: [status, serviceId, result, receipt]
      properties:
        status: { const: SUCCESS }
        serviceId: { const: gxeon_json_validate_v1 }
        result:
          type: object
          required: [valid, errors, details]
          properties:
            valid: { type: boolean }
            errors:
              type: array
              items: { type: string }
            details:
              type: object
              properties:
                parsedType: { type: string }
                byteLength: { type: integer }
                keyCount: { type: integer }
        receipt: { $ref: '#/components/schemas/Receipt' }
    Receipt:
      type: object
      required: [receiptId, serviceId, amountUsdc, network, txHash, resultHash, evidenceHash]
      properties:
        receiptId: { type: string }
        serviceId: { type: string }
        amountUsdc: { type: string }
        network: { const: eip155:8453 }
        txHash: { type: string }
        settlementId: { type: string }
        resultHash: { type: string }
        evidenceHash: { type: string }
        createdAt: { type: string, format: date-time }
    PaymentChallenge:
      type: object
      required: [x402Version, status, accepts, serviceId]
      properties:
        x402Version: { const: 2 }
        status: { const: 402 }
        title: { type: string }
        error: { type: string }
        serviceId: { const: gxeon_json_validate_v1 }
        accepts:
          type: array
          items:
            type: object
            properties:
              scheme: { const: exact }
              network: { const: eip155:8453 }
              asset: { type: string }
              amount: { type: string }
              payTo: { type: string }
              maxTimeoutSeconds: { type: integer }
    Error:
      type: object
      properties:
        error: { type: string }
        message: { type: string }
    RetryableError:
      type: object
      properties:
        error: { type: string, enum: [SETTLEMENT_PENDING, DELIVERY_UNAVAILABLE, PAYMENT_OR_DELIVERY_UNAVAILABLE] }
        message: { type: string }
        retry:
          type: object
          properties:
            method: { const: POST }
            reuseRequestBody: { const: true }
            reusePaymentSignature: { const: true }
