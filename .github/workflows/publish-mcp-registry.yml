name: Publish GXEON MCP Registry

on:
  push:
    branches: [main]
    paths:
      - "server.json"
      - ".github/workflows/publish-mcp-registry.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MCP Publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          chmod +x ./mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Smoke public marketplace MCP
        run: |
          for ATTEMPT in $(seq 1 18); do
            INIT=$(curl -fsS -X POST 'https://gxeon-wallet-command-center.vercel.app/api/v1/mcp?view=public-market' \
              -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28"}}' || true)

            if echo "$INIT" | jq -e '.result.serverInfo.name == "gxeon-public-market" and .result.serverInfo.version == "1.0.2"' >/dev/null 2>&1; then
              break
            fi

            if [ "$ATTEMPT" -eq 18 ]; then
              echo "Production MCP did not reach v1.0.2 in time."
              echo "$INIT"
              exit 1
            fi

            sleep 10
          done

          TOOLS=$(curl -fsS -X POST 'https://gxeon-wallet-command-center.vercel.app/api/v1/mcp?view=public-market' \
            -H 'content-type: application/json' \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/list"}')
          echo "$TOOLS" | jq -e '
            [.result.tools[].name] == [
              "gxeon_list_services",
              "gxeon_list_credit_packs",
              "gxeon_plan_purchase",
              "gxeon_get_agent_buying_guide"
            ]'

      - name: Authenticate to Official MCP Registry
        run: ./mcp-publisher login github-oidc --registry=https://registry.modelcontextprotocol.io

      - name: Publish GXEON Agent Marketplace
        run: ./mcp-publisher publish server.json

      - name: Verify official Registry record
        run: |
          REGISTRY=$(curl -fsSL 'https://registry.modelcontextprotocol.io/v0.1/servers/io.github.xpex-systems-ai%2Fgxeon-agent-marketplace/versions/latest')
          echo "$REGISTRY" | jq -e '
            .server.name == "io.github.xpex-systems-ai/gxeon-agent-marketplace" and
            .server.version == "1.0.2" and
            ._meta["io.modelcontextprotocol.registry/official"].status == "active" and
            ._meta["io.modelcontextprotocol.registry/official"].isLatest == true'
